services:
  app:
    volumes:
      - type: bind
        source: ${SOLOTASKS_BACKUP_DIR:?Set an existing absolute backup directory}
        target: /backups
        bind:
          create_host_path: false
  scheduler:
    volumes:
      - type: bind
        source: ${SOLOTASKS_BACKUP_DIR:?Set an existing absolute backup directory}
        target: /backups
        bind:
          create_host_path: false
