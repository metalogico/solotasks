name: sh-solotasks

x-environment: &environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${SOLOTASKS_URL:-http://localhost:8092}
  APP_TIMEZONE: Europe/Rome
  DB_CONNECTION: sqlite
  DB_DATABASE: /var/lib/sh-solotasks/database.sqlite
  DB_FOREIGN_KEYS: "true"
  SESSION_DRIVER: file
  SESSION_COOKIE: ${SESSION_COOKIE:-sh_solotasks_session}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  LOG_CHANNEL: stderr
  SOLOTASKS_BACKUP_PATH: /backups

services:
  app:
    image: ${SOLOTASKS_IMAGE:-sh-solotasks:local}
    build: .
    init: true
    restart: unless-stopped
    mem_limit: 512m
    env_file: ${SOLOTASKS_ENV_FILE:-.env}
    environment: *environment
    ports:
      - "${SOLOTASKS_BIND_IP:-127.0.0.1}:${SOLOTASKS_PORT:-8092}:80"
    volumes:
      - data:/var/lib/sh-solotasks
      - storage:/var/www/html/storage
      - backups:/backups
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  scheduler:
    image: ${SOLOTASKS_IMAGE:-sh-solotasks:local}
    init: true
    restart: unless-stopped
    mem_limit: 128m
    user: www-data
    env_file: ${SOLOTASKS_ENV_FILE:-.env}
    environment: *environment
    entrypoint: ["php", "artisan", "schedule:work", "--no-interaction"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - data:/var/lib/sh-solotasks
      - storage:/var/www/html/storage
      - backups:/backups

volumes:
  data:
  storage:
  backups:
